<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#00a884"><title>ConnectChat</title><link rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="style.css"></head><body>
<div class="app">
<aside id="home">
<header class="home-head"><h1>ConnectChat</h1><div class="head-icons"><button id="camera">⌾</button><button id="newChat">＋</button><button id="menu">⋮</button></div></header>
<div class="search"><span>⌕</span><input id="search" placeholder="Search" autocomplete="off"></div>
<div class="filter-row"><button class="filter active" data-filter="all">All</button><button class="filter" data-filter="unread">Unread</button><button class="filter" data-filter="favs">Favorites</button></div>
<div id="tabContent" class="tab-content"></div>
<nav class="bottom-nav"><button class="nav active" data-tab="chats"><span>💬</span><b>Chats</b></button><button class="nav" data-tab="updates"><span>◉</span><b>Updates</b></button><button class="nav" data-tab="communities"><span>⌘</span><b>Communities</b></button><button class="nav" data-tab="calls"><span>☎</span><b>Calls</b></button></nav>
</aside>
<main id="main">
<div id="empty" class="empty"><div class="lock">🔒</div><h2>ConnectChat</h2><p>Private messaging, redesigned.</p><small>Choose a chat to start messaging</small></div>
<section id="conversation" class="conversation hidden">
<header class="chat-head"><button id="back" class="back">‹</button><div id="avatar" class="avatar"></div><div class="contact"><strong id="name"></strong><small id="status"></small></div><div class="grow"></div><button id="video">▣</button><button id="call">☎</button><button id="chatMenu">⋮</button></header>
<div class="secure">🔒 Messages are stored locally in this demo.</div><div id="messages" class="messages"></div>
<div id="emojiBar" class="emoji-bar hidden">😀 😂 😍 😎 👍 ❤️ 🎉 🔥 😢 🙏</div>
<form id="composer"><button type="button" id="emoji">☺</button><button type="button" id="attach">＋</button><input id="input" placeholder="Message" autocomplete="off"><button class="send">➤</button></form>
</section></main></div><div id="toast" class="toast"></div><script type="module" src="firebase.js"></script><script type="module" src="app.js"></script></body></html>
